{% extends "base.html" %}
{% set title = "Home" %}

{% block content %}
<div class="layout">
  <section class="panel map-panel">
    <div class="panel-title panel-title-row">
      <span>Map</span>

      <div class="panel-actions">
        <button id="clearPinsBtn" class="btn" type="button">Clear Pins</button>
      </div>
    </div>

    <div class="map-toolbar">
      <form id="mapUploadForm" class="map-upload-form">
        <input
          id="mapFileInput"
          name="map_file"
          type="file"
          accept=".png,.jpg,.jpeg,.webp"
        />
        <button id="uploadMapBtn" class="btn primary" type="submit">
          Upload Map
        </button>
      </form>

      <div id="mapUploadStatus" class="map-upload-status">
        Current map: {{ current_map.filename }}
      </div>
    </div>

    <div class="map-frame">
      <div id="map"></div>
    </div>

    <div class="hint">
      Uploading a new map clears all current pins. Click on the image to place new pins.
    </div>
  </section>

  <section class="panel sidebar">
    <div class="panel-title">Current Pins</div>
    <div id="pinList" class="pin-list">
      <div class="empty" id="emptyState">No pins yet. Click on the map to create one.</div>
    </div>
  </section>
</div>

<script>
  window.CURRENT_MAP = JSON.parse('{{ current_map | tojson | safe }}');
</script>
<script defer src="{{ url_for('static', filename='app.js') }}"></script>
{% endblock %}
